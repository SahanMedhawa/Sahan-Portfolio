<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="CrossLink - Cross-Sector Collaboration Platform Preview">
  <defs>
    <linearGradient id="cl-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="55%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="cl-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <radialGradient id="cl-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <pattern id="cl-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#cl-bg)"/>
  <rect width="800" height="400" fill="url(#cl-grid)"/>
  <circle cx="120" cy="80" r="180" fill="url(#cl-glow)"/>
  <circle cx="700" cy="340" r="160" fill="url(#cl-glow)" opacity="0.6"/>

  <!-- Top status bar -->
  <g>
    <circle cx="40" cy="38" r="6" fill="#ef4444"/>
    <circle cx="60" cy="38" r="6" fill="#f59e0b"/>
    <circle cx="80" cy="38" r="6" fill="#10b981"/>
    <rect x="110" y="28" width="240" height="22" rx="6" fill="#ffffff" fill-opacity="0.12"/>
    <text x="125" y="44" font-family="Inter, Arial, sans-serif" font-size="13" fill="#ffffff" fill-opacity="0.9">crosslink.app  /  matchmaker</text>

    <!-- Role pills -->
    <g font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600">
      <rect x="500" y="24" width="60" height="28" rx="14" fill="#10b981" fill-opacity="0.3" stroke="#10b981" stroke-opacity="0.6"/>
      <text x="530" y="42" fill="#d1fae5" text-anchor="middle">NGO</text>
      <rect x="568" y="24" width="80" height="28" rx="14" fill="#0ea5e9" fill-opacity="0.3" stroke="#0ea5e9" stroke-opacity="0.6"/>
      <text x="608" y="42" fill="#bae6fd" text-anchor="middle">Volunteer</text>
      <rect x="656" y="24" width="80" height="28" rx="14" fill="#a78bfa" fill-opacity="0.3" stroke="#a78bfa" stroke-opacity="0.6"/>
      <text x="696" y="42" fill="#ede9fe" text-anchor="middle">Corporate</text>
    </g>
  </g>

  <!-- Left: Map / location card -->
  <g>
    <rect x="40" y="80" width="300" height="280" rx="16" fill="url(#cl-card)" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="60" y="115" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#ffffff">Volunteer Matchmaker</text>
    <text x="60" y="135" font-family="Inter, Arial, sans-serif" font-size="11" fill="#ffffff" fill-opacity="0.65">Skill overlap + Haversine</text>

    <!-- Map background -->
    <rect x="60" y="150" width="260" height="140" rx="12" fill="#0f172a" fill-opacity="0.45"/>
    <!-- Subtle map grid -->
    <g stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" fill="none">
      <path d="M 60 180 L 320 180"/>
      <path d="M 60 220 L 320 220"/>
      <path d="M 60 260 L 320 260"/>
      <path d="M 110 150 L 110 290"/>
      <path d="M 170 150 L 170 290"/>
      <path d="M 230 150 L 230 290"/>
      <path d="M 290 150 L 290 290"/>
    </g>
    <!-- Pseudo coastline path -->
    <path d="M 70 175 Q 130 195 170 185 Q 220 170 280 200 Q 305 220 295 270 Q 250 285 200 275 Q 150 270 100 260 Q 75 240 70 175 Z"
          fill="#10b981" fill-opacity="0.18" stroke="#10b981" stroke-opacity="0.45" stroke-width="1.2"/>

    <!-- Distance lines from center pin to volunteers -->
    <g stroke="#22d3ee" stroke-opacity="0.5" stroke-dasharray="3 3" fill="none" stroke-width="1.2">
      <line x1="190" y1="220" x2="120" y2="190"/>
      <line x1="190" y1="220" x2="265" y2="200"/>
      <line x1="190" y1="220" x2="155" y2="265"/>
    </g>

    <!-- Volunteer pins -->
    <g>
      <circle cx="120" cy="190" r="6" fill="#0ea5e9" stroke="#ffffff" stroke-width="1.5"/>
      <circle cx="265" cy="200" r="6" fill="#0ea5e9" stroke="#ffffff" stroke-width="1.5"/>
      <circle cx="155" cy="265" r="6" fill="#0ea5e9" stroke="#ffffff" stroke-width="1.5"/>
    </g>

    <!-- Center NGO pin (drop shape) -->
    <path d="M 190 205 C 178 205 178 222 190 235 C 202 222 202 205 190 205 Z" fill="#ef4444" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="190" cy="215" r="3" fill="#ffffff"/>

    <!-- Distance chips -->
    <g font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600">
      <rect x="60" y="305" width="78" height="24" rx="12" fill="#22d3ee" fill-opacity="0.2" stroke="#22d3ee" stroke-opacity="0.5"/>
      <text x="99" y="321" fill="#cffafe" text-anchor="middle">2.4 km</text>

      <rect x="146" y="305" width="78" height="24" rx="12" fill="#22d3ee" fill-opacity="0.2" stroke="#22d3ee" stroke-opacity="0.5"/>
      <text x="185" y="321" fill="#cffafe" text-anchor="middle">5.1 km</text>

      <rect x="232" y="305" width="88" height="24" rx="12" fill="#22d3ee" fill-opacity="0.2" stroke="#22d3ee" stroke-opacity="0.5"/>
      <text x="276" y="321" fill="#cffafe" text-anchor="middle">7.8 km</text>
    </g>
  </g>

  <!-- Right column: matches + SDG / news -->
  <g>
    <!-- Match score card -->
    <rect x="360" y="80" width="400" height="160" rx="16" fill="url(#cl-card)" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="380" y="115" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#ffffff">Strong matches today</text>
    <text x="380" y="133" font-family="Inter, Arial, sans-serif" font-size="11" fill="#ffffff" fill-opacity="0.6">Email notifications sent</text>

    <!-- Match item 1 -->
    <g font-family="Inter, Arial, sans-serif">
      <rect x="380" y="148" width="360" height="36" rx="10" fill="#ffffff" fill-opacity="0.10"/>
      <circle cx="400" cy="166" r="11" fill="#0ea5e9"/>
      <text x="400" y="170" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
      <text x="420" y="170" font-size="12" font-weight="600" fill="#ffffff">Asha Perera</text>
      <text x="420" y="180" font-size="9" fill="#ffffff" fill-opacity="0.6">React, UX, Outreach</text>
      <!-- Score bar -->
      <rect x="560" y="160" width="120" height="6" rx="3" fill="#ffffff" fill-opacity="0.15"/>
      <rect x="560" y="160" width="108" height="6" rx="3" fill="#10b981"/>
      <text x="700" y="167" font-size="11" font-weight="700" fill="#10b981">92%</text>

      <!-- Match item 2 -->
      <rect x="380" y="192" width="360" height="36" rx="10" fill="#ffffff" fill-opacity="0.06"/>
      <circle cx="400" cy="210" r="11" fill="#a78bfa"/>
      <text x="400" y="214" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">D</text>
      <text x="420" y="214" font-size="12" font-weight="600" fill="#ffffff">Dilan Fernando</text>
      <text x="420" y="224" font-size="9" fill="#ffffff" fill-opacity="0.6">Logistics, Field</text>
      <rect x="560" y="204" width="120" height="6" rx="3" fill="#ffffff" fill-opacity="0.15"/>
      <rect x="560" y="204" width="93" height="6" rx="3" fill="#0ea5e9"/>
      <text x="700" y="211" font-size="11" font-weight="700" fill="#0ea5e9">78%</text>
    </g>

    <!-- SDG card -->
    <rect x="360" y="252" width="190" height="108" rx="16" fill="url(#cl-card)" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="378" y="278" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#ffffff">UN SDG focus</text>
    <g font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff">
      <rect x="378" y="288" width="38" height="38" rx="8" fill="#ef4444"/>
      <text x="397" y="312" text-anchor="middle">3</text>
      <rect x="424" y="288" width="38" height="38" rx="8" fill="#10b981"/>
      <text x="443" y="312" text-anchor="middle">4</text>
      <rect x="470" y="288" width="38" height="38" rx="8" fill="#0ea5e9"/>
      <text x="489" y="312" text-anchor="middle">13</text>
    </g>
    <text x="378" y="348" font-family="Inter, Arial, sans-serif" font-size="10" fill="#ffffff" fill-opacity="0.7">Health - Education - Climate</text>

    <!-- CSR News card -->
    <rect x="570" y="252" width="190" height="108" rx="16" fill="url(#cl-card)" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="588" y="278" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#ffffff">CSR news</text>
    <g font-family="Inter, Arial, sans-serif">
      <rect x="588" y="288" width="156" height="6" rx="3" fill="#ffffff" fill-opacity="0.35"/>
      <rect x="588" y="300" width="120" height="6" rx="3" fill="#ffffff" fill-opacity="0.22"/>
      <rect x="588" y="312" width="140" height="6" rx="3" fill="#ffffff" fill-opacity="0.22"/>
      <rect x="588" y="324" width="100" height="6" rx="3" fill="#ffffff" fill-opacity="0.22"/>
      <rect x="588" y="338" width="68" height="18" rx="9" fill="#10b981" fill-opacity="0.3" stroke="#10b981" stroke-opacity="0.6"/>
      <text x="622" y="351" font-size="9" font-weight="700" fill="#d1fae5" text-anchor="middle">LIVE</text>
    </g>
  </g>

  <text x="400" y="388" font-family="Inter, Arial, sans-serif" font-size="11" fill="#ffffff" fill-opacity="0.55" text-anchor="middle">CrossLink - cross-sector collaboration platform</text>
</svg>
