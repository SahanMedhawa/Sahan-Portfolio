<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="HealthMate - Microservices Healthcare Platform Preview">
  <defs>
    <linearGradient id="hm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9"/>
      <stop offset="55%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="hm-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" style="stop-color:#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <radialGradient id="hm-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#22d3ee" stop-opacity="0.7"/>
      <stop offset="100%" style="stop-color:#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hm-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#hm-bg)"/>
  <rect width="800" height="400" fill="url(#hm-grid)"/>
  <circle cx="120" cy="80" r="180" fill="url(#hm-glow)"/>
  <circle cx="700" cy="340" r="160" fill="url(#hm-glow)" opacity="0.6"/>

  <!-- Top status bar -->
  <g>
    <circle cx="40" cy="38" r="6" fill="#ef4444"/>
    <circle cx="60" cy="38" r="6" fill="#f59e0b"/>
    <circle cx="80" cy="38" r="6" fill="#10b981"/>
    <rect x="110" y="28" width="220" height="22" rx="6" fill="#ffffff" fill-opacity="0.12"/>
    <text x="125" y="44" font-family="Inter, Arial, sans-serif" font-size="13" fill="#ffffff" fill-opacity="0.9">healthmate.app  ·  /dashboard</text>
    <rect x="640" y="22" width="130" height="32" rx="16" fill="#10b981" fill-opacity="0.25" stroke="#10b981" stroke-opacity="0.6"/>
    <circle cx="660" cy="38" r="5" fill="#10b981"/>
    <text x="675" y="42" font-family="Inter, Arial, sans-serif" font-size="12" fill="#d1fae5">9/9 services live</text>
  </g>

  <!-- Left card: Patient queue -->
  <g>
    <rect x="40" y="80" width="320" height="280" rx="16" fill="url(#hm-card)" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="60" y="115" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#ffffff">Live Queue</text>
    <text x="60" y="135" font-family="Inter, Arial, sans-serif" font-size="11" fill="#ffffff" fill-opacity="0.65">Dr. Perera · Cardiology</text>
    <rect x="270" y="100" width="70" height="22" rx="11" fill="#22d3ee" fill-opacity="0.25" stroke="#22d3ee" stroke-opacity="0.6"/>
    <text x="280" y="115" font-family="Inter, Arial, sans-serif" font-size="10" fill="#cffafe">Ï LIVE</text>

    <!-- Queue items -->
    <g font-family="Inter, Arial, sans-serif">
      <rect x="60" y="155" width="280" height="44" rx="10" fill="#ffffff" fill-opacity="0.14" stroke="#22d3ee" stroke-opacity="0.4"/>
      <circle cx="82" cy="177" r="14" fill="#22d3ee"/>
      <text x="82" y="181" font-size="12" font-weight="700" fill="#082f49" text-anchor="middle">12</text>
      <text x="108" y="174" font-size="13" font-weight="600" fill="#ffffff">Nimal Silva</text>
      <text x="108" y="190" font-size="10" fill="#ffffff" fill-opacity="0.6">In consultation · 04:23</text>

      <rect x="60" y="207" width="280" height="44" rx="10" fill="#ffffff" fill-opacity="0.08"/>
      <circle cx="82" cy="229" r="14" fill="#ffffff" fill-opacity="0.2"/>
      <text x="82" y="233" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">13</text>
      <text x="108" y="226" font-size="13" font-weight="600" fill="#ffffff">Saman Perera</text>
      <text x="108" y="242" font-size="10" fill="#ffffff" fill-opacity="0.6">Waiting · ~6 min</text>

      <rect x="60" y="259" width="280" height="44" rx="10" fill="#ffffff" fill-opacity="0.08"/>
      <circle cx="82" cy="281" r="14" fill="#ffffff" fill-opacity="0.2"/>
      <text x="82" y="285" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">14</text>
      <text x="108" y="278" font-size="13" font-weight="600" fill="#ffffff">A. Fernando</text>
      <text x="108" y="294" font-size="10" fill="#ffffff" fill-opacity="0.6">Waiting · ~12 min</text>
    </g>

    <!-- Pause/Resume controls -->
    <rect x="60" y="318" width="120" height="28" rx="8" fill="#ffffff" fill-opacity="0.18"/>
    <text x="120" y="336" font-family="Inter, Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">ø Pause queue</text>
    <rect x="190" y="318" width="120" height="28" rx="8" fill="#22d3ee" fill-opacity="0.35" stroke="#22d3ee" stroke-opacity="0.6"/>
    <text x="250" y="336" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#cffafe" text-anchor="middle">’ Next patient</text>
  </g>

  <!-- Right column: services + telemedicine -->
  <g>
    <!-- Microservices grid -->
    <rect x="380" y="80" width="380" height="160" rx="16" fill="url(#hm-card)" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="400" y="115" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#ffffff">Microservices</text>
    <text x="400" y="133" font-family="Inter, Arial, sans-serif" font-size="11" fill="#ffffff" fill-opacity="0.6">Nginx gateway · 9 services</text>

    <g font-family="Inter, Arial, sans-serif" font-size="10">
      <rect x="400" y="148" width="80" height="28" rx="8" fill="#10b981" fill-opacity="0.25" stroke="#10b981" stroke-opacity="0.5"/>
      <text x="440" y="166" fill="#d1fae5" text-anchor="middle">patient Ï</text>

      <rect x="488" y="148" width="80" height="28" rx="8" fill="#10b981" fill-opacity="0.25" stroke="#10b981" stroke-opacity="0.5"/>
      <text x="528" y="166" fill="#d1fae5" text-anchor="middle">doctor Ï</text>

      <rect x="576" y="148" width="80" height="28" rx="8" fill="#10b981" fill-opacity="0.25" stroke="#10b981" stroke-opacity="0.5"/>
      <text x="616" y="166" fill="#d1fae5" text-anchor="middle">appoint. Ï</text>

      <rect x="664" y="148" width="80" height="28" rx="8" fill="#10b981" fill-opacity="0.25" stroke="#10b981" stroke-opacity="0.5"/>
      <text x="704" y="166" fill="#d1fae5" text-anchor="middle">admin Ï</text>

      <rect x="400" y="184" width="80" height="28" rx="8" fill="#10b981" fill-opacity="0.25" stroke="#10b981" stroke-opacity="0.5"/>
      <text x="440" y="202" fill="#d1fae5" text-anchor="middle">notify Ï</text>

      <rect x="488" y="184" width="80" height="28" rx="8" fill="#10b981" fill-opacity="0.25" stroke="#10b981" stroke-opacity="0.5"/>
      <text x="528" y="202" fill="#d1fae5" text-anchor="middle">telemed Ï</text>

      <rect x="576" y="184" width="80" height="28" rx="8" fill="#10b981" fill-opacity="0.25" stroke="#10b981" stroke-opacity="0.5"/>
      <text x="616" y="202" fill="#d1fae5" text-anchor="middle">payment Ï</text>

      <rect x="664" y="184" width="80" height="28" rx="8" fill="#10b981" fill-opacity="0.25" stroke="#10b981" stroke-opacity="0.5"/>
      <text x="704" y="202" fill="#d1fae5" text-anchor="middle">ai Ï</text>
    </g>

    <!-- Telemedicine card -->
    <rect x="380" y="252" width="180" height="108" rx="16" fill="url(#hm-card)" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="398" y="278" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Telemed call</text>
    <rect x="398" y="290" width="144" height="50" rx="10" fill="#0f172a" fill-opacity="0.55"/>
    <circle cx="430" cy="315" r="14" fill="#ffffff" fill-opacity="0.4"/>
    <circle cx="465" cy="315" r="14" fill="#22d3ee" fill-opacity="0.6"/>
    <text x="398" y="354" font-family="Inter, Arial, sans-serif" font-size="10" fill="#ffffff" fill-opacity="0.7">Jitsi · 12:04</text>

    <!-- Payment / Stripe -->
    <rect x="580" y="252" width="180" height="108" rx="16" fill="url(#hm-card)" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="598" y="278" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Payment</text>
    <text x="598" y="312" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">LKR 4,500</text>
    <rect x="598" y="324" width="120" height="22" rx="11" fill="#10b981" fill-opacity="0.3" stroke="#10b981" stroke-opacity="0.6"/>
    <text x="608" y="339" font-family="Inter, Arial, sans-serif" font-size="10" fill="#d1fae5"> Stripe paid</text>
  </g>

  <text x="400" y="388" font-family="Inter, Arial, sans-serif" font-size="11" fill="#ffffff" fill-opacity="0.55" text-anchor="middle">HealthMate · microservices healthcare platform</text>
</svg>
